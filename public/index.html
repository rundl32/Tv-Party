<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Party</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #14121f; color: #f4f1ea; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(92vw, 720px); text-align: center; }
  h1 { font-size: clamp(36px, 7vw, 64px); margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: #b9b3c9; margin: 0 0 32px; font-size: 18px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  a { display: block; padding: 32px 16px; border-radius: 20px; text-decoration: none; color: #14121f;
      font-weight: 700; font-size: 24px; outline: none; }
  a span { display: block; font-weight: 400; font-size: 15px; margin-top: 6px; opacity: .75; }
  a.tv { background: #ffd166; } a.phone { background: #06d6a0; }
  a:focus, a:hover { box-shadow: 0 0 0 6px #fff; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>TV Party</h1>
  <p>The TV is the console. Your phones are the controllers.</p>
  <div class="choices">
    <a class="tv" href="/tv" autofocus>Open on TV<span>Shows the game and the join code</span></a>
    <a class="phone" href="/play">Use as controller<span>Enter the code from the TV</span></a>
  </div>
</main>
</body>
</html>
